[build]
  # Dossier de build à publier
  publish = "frontend/dist/demenagement-site/browser"
  
  # Commande de build
  command = "cd frontend && npm ci && npm run build"

[build.environment]
  # Version de Node.js à utiliser
  NODE_VERSION = "24"

# Configuration des redirections pour SPA Angular
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Configuration des fonctions serverless
[functions]
  directory = "netlify/functions"

# En-têtes de sécurité (HSTS est déjà envoyé automatiquement par Netlify)
# CSP : tout est servi depuis le domaine (polices, icônes, images, formulaire) — aucun tiers autorisé.
# 'unsafe-inline' pour les styles uniquement : Angular injecte les styles de composants en <style>.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"

# Développement local : `npx netlify-cli dev` (site + fonctions sur http://localhost:8888)
[dev]
  command = "npm --prefix frontend run dev"
  targetPort = 4200
  port = 8888
  framework = "#custom"

# Cache navigateur : fichiers hashés par Angular (contenu ⇒ nom) = cache 1 an immuable
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images non hashées : 1 semaine (changer le nom du fichier en cas de modification)
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
