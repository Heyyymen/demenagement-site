[build]
  # Dossier de build à publier
  publish = "frontend/dist/demenagement-site/browser"
  
  # Commande de build
  command = "cd frontend && npm ci && npm run build"

[build.environment]
  # Version de Node.js à utiliser
  NODE_VERSION = "24"

# Configuration des redirections pour SPA Angular
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Configuration des fonctions serverless
[functions]
  directory = "netlify/functions"

# Configuration des headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Développement local : `npx netlify-cli dev` (site + fonctions sur http://localhost:8888)
[dev]
  command = "npm --prefix frontend run dev"
  targetPort = 4200
  port = 8888
  framework = "#custom"
